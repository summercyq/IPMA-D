<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>計算題庫｜IPMA Lab</title><link rel="stylesheet" href="style.css?v=4f56a25ec1a7"></head><body class="study-page" data-kind="calc"><header class="study-header"><a class="brand" href="index.html?v=4f56a25ec1a7" aria-label="返回題庫首頁"><span class="logo">P.</span> IPMA <b>LAB</b></a><nav class="page-nav" aria-label="題庫頁面"><a href="choice.html?v=4f56a25ec1a7">選擇題庫</a><a href="calc.html?v=4f56a25ec1a7" class="active" aria-current="page">計算題庫</a><a href="answers.html?v=4f56a25ec1a7">解答題庫</a></nav></header><section class="sync-panel" data-sync aria-label="Google 登入與進度同步"></section><main class="study-main"><div class="study-title"><h1 id="title">計算題庫</h1><span>30 題</span></div>
<details class="practice-tools"><summary>篩選與練習紀錄</summary><div class="tool-content"><section class="stats" aria-label="學習統計"><div><span>已練習</span><strong id="done">0 <small>/ 313</small></strong></div><div><span>正確率 <small id="rate-label">最近作答</small></span><strong id="rate">—</strong></div><div><span>待複習錯題</span><strong id="wrong">0</strong></div><div><span>已收藏</span><strong id="saved">0</strong></div></section>
<div class="toolbar"><div class="tabs"><button class="selected" data-filter="all">全部題目</button><button data-filter="wrong">錯題本</button><button data-filter="saved">我的收藏</button><button data-filter="new">未練習</button></div><label class="search">⌕ <input id="search" placeholder="搜尋題目或題號" aria-label="搜尋題目或題號"></label></div>
</div></details>
<section class="random-panel" aria-label="隨機出題"><form id="random-form" novalidate><label for="random-count">隨機出題</label><input id="random-count" type="text" inputmode="numeric" pattern="[0-9]*" value="10" aria-label="隨機題數" aria-describedby="random-hint random-message"><span>題</span><button id="random-start" class="primary" type="submit" disabled>載入題庫中…</button><button id="random-all" class="outline" type="button" hidden>使用全部題目</button><button id="random-exit" class="outline" type="button" hidden>返回一般練習</button></form><p id="random-hint">題庫載入後即可開始隨機練習。</p><p id="random-message" role="status"></p><p id="round-status" role="status"></p></section>
<div class="progress"><div id="progress-fill"></div></div><div class="position"><span id="position"></span><form id="jump-form" class="jump-form" novalidate><label for="jump">跳至題號</label><input id="jump" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="1–30" aria-label="跳至題號" aria-describedby="jump-message" autocomplete="off"><button id="jump-go" class="outline" type="submit">前往</button></form></div><p id="jump-message" class="jump-message" role="status"></p>
<section class="question-card" id="card" aria-live="polite"></section><div class="bottom"><button class="outline" id="prev">← 上一題</button><span id="keyboard"></span><button id="next" class="outline">下一題 →</button></div>
<footer><span id="storage-status">進度自動儲存；登入 Google 後跨裝置同步</span><button id="reset">重設紀錄</button></footer><div id="notice" role="status"></div></main><script src="boot.js?v=4f56a25ec1a7" data-page="app"></script></body></html>
