<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選擇題庫｜IPMA Lab</title><link rel="stylesheet" href="style.css"></head><body class="study-page" data-kind="choice"><header class="study-header"><a class="brand" href="./" aria-label="返回題庫首頁"><span class="logo">P.</span> IPMA <b>LAB</b></a><nav class="page-nav" aria-label="題庫頁面"><a href="choice.html" class="active" aria-current="page">選擇題庫</a><a href="calc.html">計算題庫</a><a href="answers.html">解答題庫</a></nav></header><section class="sync-panel" data-sync aria-label="Google 登入與進度同步"></section><main class="study-main"><div class="study-title"><h1 id="title">選擇題庫</h1><span>313 題</span></div>
