<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPMA Lab｜專案管理練習室</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="logo">P.</span> IPMA <b>LAB</b></a><span class="header-note">每天一點練習，離目標更近一步</span><span class="pill">LEVEL D</span></header>
<div class="layout"><aside><div class="eyebrow">YOUR STUDY SPACE</div><h1>專案管理<br>練習室<span>。</span></h1><p class="intro">把知識變成直覺。<br>從一道題開始，累積你的實力。</p><nav aria-label="題庫"><button class="nav active" data-kind="choice"><span>▤ 選擇題庫</span><small>313</small></button><button class="nav" data-kind="calc"><span>⌗ 計算題庫</span><small>30</small></button></nav><div class="side-card"><span class="eyebrow">小提醒</span><p id="tip">先思考，再作答。<br>答錯的題目會自動加入錯題本。</p></div><div class="source">依據上傳的 IPMA-D 模擬題庫<br>選擇題 202010 · 計算題 202110</div></aside>
<main><div class="topline"><div><span class="eyebrow">PRACTICE MAKES PROGRESS</span><h2 id="title">選擇題練習</h2></div><button id="shuffle" class="outline">⇄ 隨機排序</button></div><section class="stats" aria-label="學習統計"><div><span>已練習</span><strong id="done">0 <small>/ 313</small></strong></div><div><span>正確率 <small id="rate-label">最近作答</small></span><strong id="rate">—</strong></div><div><span>待複習錯題</span><strong id="wrong">0</strong></div><div><span>已收藏</span><strong id="saved">0</strong></div></section>
<div class="toolbar"><div class="tabs"><button class="selected" data-filter="all">全部題目</button><button data-filter="wrong">錯題本</button><button data-filter="saved">我的收藏</button><button data-filter="new">未練習</button></div><label class="search">⌕ <input id="search" placeholder="搜尋題目或題號" aria-label="搜尋題目或題號"></label></div>
<div class="progress"><div id="progress-fill"></div></div><div class="position"><span id="position"></span><label>跳至題號 <select id="jump" aria-label="跳至題號"></select></label></div>
<section class="question-card" id="card" aria-live="polite"></section><div class="bottom"><button class="outline" id="prev">← 上一題</button><span id="keyboard">快捷鍵：1–4 選答案 · Enter 確認</span><button id="next" class="outline">下一題 →</button></div><footer><span id="storage-status">練習紀錄自動保存在此瀏覽器</span><button id="reset">重設紀錄</button></footer><div id="notice" role="status"></div></main></div><script type="module" src="app.js"></script></body></html>
